name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The Python the Salt packages bundle; smonit imports salt from it.
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv install --dev --deploy
      - name: Formatting
        run: pipenv run black --check .
      - name: Lint
        run: pipenv run pylint --errors-only smonit worker.py tasks.py
      - name: Byte-compile
        run: pipenv run python -m compileall -q smonit worker.py tasks.py
