name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv install --dev --deploy
      - name: Formatting
        run: pipenv run black --check .
      - name: Lint
        run: pipenv run pylint --errors-only smonit worker.py tasks.py
      - name: Byte-compile
        run: pipenv run python -m compileall -q smonit worker.py tasks.py
